schema = 1
tenant = "acme-tools"
root = "docs/wörk/"

[toolkit]
client = "0.4.2"
registry = "0.4.2"
unidata = "16.0.0"
object_id = "sha1"

[ladder]
levels = ["initiative"]

[shapes]
allowed = ["bdd", "task", "spike", "crispy"]

[shapes.crispy]

[runners]
lint = "ruff"

[prioritization]
time_criticality = 400
unblocking = 300
resume = 150
aging = 100
batch = 50
risk = 0

[origin]
card = ["session", "review", "planner", "suggestion", "digest", "gossip"]

[extensions]

[extensions.risk_reduction]
type = "string"
class = "gated"
required_when = [{ field = "kind", in = ["story"] }]

[[governed]]
path = "cards/*.md"
schema = "card@1"
write = ["owner", "contributor"]

[[governed]]
path = "suggestions.jsonl"
schema = "inbox@1"
write = ["owner", "contributor", "lander"]

[[governed]]
path = "state.json"
schema = "sidecar@1"
write = ["lander"]

[[governed]]
path = "state/history.jsonl"
schema = "sidecar-events@1"
write = ["lander"]

[[governed]]
path = "BOARD.md"
schema = "board@1"
write = ["lander"]

[[governed]]
path = "config.toml"
schema = "config@1"
write = ["owner"]

[[governed]]
path = "docs/wiki/*.md"
schema = "card@1"
write = ["owner"]

