schema = 2
tenant = "acme-tools"

[toolkit]
client = "0.4.2"
registry = "0.4.2"
unidata = "16.0.0"
object_id = "sha1"

[inbox]
dedupe_window_days = 3

[[governed]]
path = "cards/*.md"
schema = "card@1"
write = ["owner", "contributor"]

[[governed]]
path = "suggestions.jsonl"
schema = "inbox@1"
write = ["owner", "contributor", "lander"]

[[governed]]
path = "state.json"
schema = "sidecar@1"
write = ["lander"]

[[governed]]
path = "state/history.jsonl"
schema = "sidecar-events@1"
write = ["lander"]

[[governed]]
path = "BOARD.md"
schema = "board@1"
write = ["lander"]

[[governed]]
path = "config.toml"
schema = "config@2"
write = ["owner"]

