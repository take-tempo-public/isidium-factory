# r-4's failure path (2026-09-14) — the mutations the fix needs. Each is one of the five findings coming back: a turn
# limit called infra, a retry that spends it twice, an attempt overwritten, a refusal that carries no spend, an end
# stamped with the phase's start, a failure no ratification can clear, and a morning review that never names it.
# Owners: the adapter and wrapper properties are `tests/factory/test_v4a.py`'s; the fold and queue are
# `tests/store/test_failed_returns.py`'s.

[[mutation]]
id = "M1"
label = "a turn limit is failed:infra again -- r-4's classification back"
file = "packages/isidium-factory/src/isidium/factory/harness.py"
find = '''    if out.get("subtype") in BUDGET_ENDS:
        return "failed:budget"
'''
replace = ''''''

[[mutation]]
id = "M2"
label = "a budget end is retried -- the adapter spends the turns twice"
file = "packages/isidium-factory/src/isidium/factory/container.py"
find = '''            if left and left[0].outcome == "failed:budget":'''
replace = '''            if False:'''

[[mutation]]
id = "M3"
label = "the second attempt overwrites the first's files"
file = "packages/isidium-factory/src/isidium/factory/container.py"
find = '''            if attempt > 1:
                _keep(rundir, attempt - 1)
'''
replace = ''''''

[[mutation]]
