# L1's mutations (2026-09-09) -- `land`. One mutation per invocation, two workers here:
#
#   python tools/mutate.py tools/mutations/l1.toml --show
#   python tools/mutate.py tools/mutations/l1.toml M1 --workers 2
#
# M1 drops the matrix check at the door: a contributor lands through a row the tenant widened (the owner's set is
# `*`, so the owner is not the discriminator). M2 lets any kind through the union. M3 lands on the head,
# never on the pending merge -- X2's cursor. M4 folds `failed` without its class. M5 keeps the board out of every
# land. M6 drops the empty-diff check: a second land at the same cursor commits again. Each names the test that must
# notice, in tests/store/test_l1.py.

[[mutation]]
id = "M1"
label = "the door is anyone's the rows admit -- a contributor lands through a widened row"
file = "packages/isidium-store/src/isidium/store/server/store.py"
find = '''        self._require(caller, "land")
        self._replay_pending()
'''
replace = '''        self._replay_pending()
'''

[[mutation]]
id = "M2"
label = "the union is open -- an unknown kind lands"
file = "packages/isidium-store/src/isidium/store/core/events.py"
find = '''    if kind not in KINDS:
        raise Refusal("event.kind", str(kind), "not a kind of the union: " + ", ".join(KINDS))
    try:
        event: Event = _ADAPTER.validate_python(dict(raw))
        return event
    except ValidationError as e:
'''
replace = '''    try:
        event: Event = _ADAPTER.validate_python({**dict(raw), "kind": "question", "text": str(kind)})
        return event
    except ValidationError as e:
'''

[[mutation]]
id = "M3"
