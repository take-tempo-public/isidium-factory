            self.db.execute(
                "INSERT INTO phases (run_id, phase, agent, model, effort, prompt_version, tokens, cost_micro,"'''
replace = '''        with telemetry.span(SPAN, **{"isidium.run_id": run_id}):
            self.db.execute(
                "INSERT INTO phases (run_id, phase, agent, model, effort, prompt_version, tokens, cost_micro,"'''

