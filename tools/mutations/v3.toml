# V3 (2026-09-11) — the ledger and dispatch: the mutations the properties need. The brief's nine, then the four the
# ruled option 3 and the F-b fix add, then three more the build found worth holding (the sitting's grade, the grant,
# the event schema's gate). Run one at a time against the one test file that owns the property (the chunk plan's
# targeted practice: tests/factory/test_v3.py for M1-M7, M9, M12, M14; tests/store/test_v3.py for the rest).

[[mutation]]
id = "M1"
label = "the record after the branch -- the story branch asked for before the ledger row exists"
file = "packages/isidium-factory/src/isidium/factory/dispatch.py"
find = '''    run_id = ledger.dispatch(run)
    sp.set_attribute("isidium.run_id", run_id)
    branch = f"story/{run_id}"
    try:
        forge.branch(branch, ctx.base_sha)'''
replace = '''    forge.branch(f"story/r-{len(ledger.runs()) + 1}", ctx.base_sha)
    run_id = ledger.dispatch(run)
    sp.set_attribute("isidium.run_id", run_id)
    branch = f"story/{run_id}"
    try:
        pass'''

