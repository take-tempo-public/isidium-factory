# K7b's mutations (2026-09-06) -- the efficiency shapes and the counters from the K7 review (F7, F8, F9, F27, F12,
# F13, F14, F16) and the code the five rulings of 2026-09-06 call for (Q15-Q19). One mutation per invocation:
#
#   python tools/mutate.py tools/mutations/k7b.toml M7
#
# Each one puts back the defect the review measured, or breaks the seam that replaced it, and names the test that
# must notice. M1/M2 are the per-file index (F27): ambiguity lost, and the door indexing per ref again. M3/M4 are one
# card's projection (F9): every card's label computed again, and the members index going stale. M5/M6 are the batch
# fetch (F7): the load hydrating per object again, and the batch door fetching an unvouched object. M7/M8 are the
# history walk (F8): a diff-tree per commit again -- and M8, dropping `--no-renames` from the log, which SURVIVED
# as an equivalent mutant: a `log` confined to one path holds no second path to pair a rename with, so the row is
# `D` with or without the flag (measured 2026-09-06, one variable at a time; the flag matters only with a wider
# pathspec, and is kept for that caller). Deleted rather than given a test it could not have: a test that passes
# with the flag and without it proves nothing. M9/M10 are the typed readers (F12).
# M11 is the inbox record unchecked (F13). M12 is the CLI counter (F14). M13 is the admission refusal counted twice
# (F16). M14-M17 are the worker (Q15): the call back on the loop, the probe queued behind the worker, the context
# not carried, a thread that would hold the exit. M18 is the root moved by policy again (Q16). M19 is the sitting
# un-burning its id (Q17). M20 is an unlanded write reported as landed (Q18). M21/M22 are the pre-identification
# row (Q19): the target written as a row again, and the span attribute unbounded.
#
# K4b's M5 and M8 were re-spelled for the `Locus` signature and re-run beside these (tools/mutations/k4b.toml).

