# Card 28 (2026-10-07) -- the lease's two properties are checked against this card's own test file only, never the
# whole suite (C5): mutate.py runs the whole suite per mutation by default, and `--show` is all it is used for here.
#
#     python tools/mutate.py tools/mutations/leases.toml --show
#     # then, by hand, one at a time: apply with Edit, run
