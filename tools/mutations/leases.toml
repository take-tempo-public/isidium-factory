#     # confirm the scenario's own test fails, restore with Edit.

[[mutation]]
id = "M1"
label = "an unexpired lease is taken twice -- the held check is inert, so the operator and the watcher can act on one run at once (killed by S2, test_an_unexpired_lease_refuses_a_second_taker)"
file = "packages/isidium-factory/src/isidium/factory/ledger.py"
