find = """        self._tree_cache = None
        return commit_oid"""
replace = "        return commit_oid"

[[mutation]]
id = "M10"
label = "the footprint is read off the config instead of counted -- S-9's first trap, taken"
file = "packages/isidium-store/src/isidium/store/server/gitrepo.py"
find = """        for line in self._git("rev-list", "--objects", "--all", "--missing=print").splitlines():
            if line.startswith("?"):
                return Footprint.FILTERED
        return Footprint.FULL"""
replace = """        if self._git("config", "--get", "remote.origin.promisor").strip() == "true":
            return Footprint.FILTERED
        return Footprint.FULL"""

[[mutation]]
id = "M11"
label = "reads spawn a process each again -- the batch reader is bypassed (C-8; 22x here)"
file = "packages/isidium-store/src/isidium/store/server/gitrepo.py"
find = """        data = self._reader().read(oid)
        if data is None:
            if oid not in self._vouched:
                raise Refusal("git.outside-footprint", oid, "this object was not resolved from a governed path")
            self._hydrate(oid)
            data = self._reader().read(oid)"""
replace = """        r = subprocess.run(
            ["git", "cat-file", "blob", oid], cwd=self.gitdir, capture_output=True, check=False, env=self._fetch_env
        )
        data = r.stdout if r.returncode == 0 else None"""
