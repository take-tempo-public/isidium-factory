# K1d's mutations (2026-08-30) -- lazy registry loading, C-13. All ten died on the first pass.
#
# Kept because a mutation set is evidence: it says which properties were proven and by which test, and it is what a
# later edit to `registry/loader.py` should be re-run against. Run one at a time on this suite -- see tools/mutate.py.
#
#   python tools/mutate.py tools/mutations/k1d.toml M3

[[mutation]]
id = "M1"
label = "`installed` forces every document -- the lazy listing lost"
file = "packages/isidium-store/src/isidium/store/registry/loader.py"
find = "        return frozenset(self._slots)"
replace = "        return frozenset(self.addresses)"

