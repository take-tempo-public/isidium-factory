# M14 is the defect the trailerless test found, restored whole. Each half alone is an EQUIVALENT mutant, and was
# measured as one (2026-09-12, survived): with `strip()` back, the two-field record is still foreign by the
# unparseable rule; with the skip back, no record is ever unparseable once only newlines are stripped. Two defences,
# so the property is killed only when both go.
[[mutation]]
id = "M14"
label = "the identity parser strips its own separator and skips what it cannot parse -- a trailerless commit passes"
file = "packages/isidium-factory/src/isidium/factory/close.py"
find = '''        record = record.strip("\r\n")
        if not record:
            continue
        fields = record.split("\x1f")
        if len(fields) != 3:
            bad.append(fields[0])
            continue
        sha, author, runs = fields'''
replace = '''        fields = record.strip().split("\x1f")
        if len(fields) < 3:
            continue
        sha, author, runs = fields[0], fields[1], fields[2]'''

