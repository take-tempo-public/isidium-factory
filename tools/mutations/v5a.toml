# V5a (2026-09-12) — the run's end, and the store told: the mutations the properties need. Every one is a way the
# chunk could look finished and not be: a run that still never ends, a report sent twice or never again, a close that
# believes a claim or skips a condition, an end the store cannot hold. Run one at a time against the file that owns
# the property — `tests/factory/test_v5a.py` owns all of them.

[[mutation]]
id = "M1"
label = "an end does not set ended_at -- the defect V5a exists for, back"
file = "packages/isidium-factory/src/isidium/factory/ledger.py"
find = '''"UPDATE runs SET outcome = ?, ended_at = ?, head_sha = COALESCE(?, head_sha),"'''
replace = '''"UPDATE runs SET outcome = ?, ended_at = CASE WHEN ? IS NULL THEN NULL ELSE NULL END, head_sha = COALESCE(?, head_sha),"'''

[[mutation]]
id = "M2"
label = "the watermark never advances -- every land re-sends the run's whole history"
file = "packages/isidium-factory/src/isidium/factory/lander.py"
find = '''    ledger.landed(run_id, through)
    return {"sent": len(report.events), **dict(result)}'''
replace = '''    return {"sent": len(report.events), **dict(result)}'''

[[mutation]]
id = "M3"
label = "the watermark advances before the store answers -- a refused land's events are never sent"
file = "packages/isidium-factory/src/isidium/factory/lander.py"
find = '''    try:
        result = call("land", report.model_dump(by_alias=True, exclude_none=True))'''
replace = '''    ledger.landed(run_id, through)
    try:
        result = call("land", report.model_dump(by_alias=True, exclude_none=True))'''

