#     python tools/mutate.py tools/mutations/runner-test-env.toml --show
#     # then, by hand, one at a time: apply with Edit, run
#     #   python -m pytest tests/factory/test_guard_installs.py -q
#     # confirm the scenario's own test fails, restore with Edit.

[[mutation]]
id = "M1"
label = "R3's install rule never matches -- `pip install ruff` and r-58's own line reach the shell unblocked (killed by test_every_install_form_is_blocked_and_recorded, S1)"
file = "packages/isidium-factory/src/isidium/factory/guard.py"
