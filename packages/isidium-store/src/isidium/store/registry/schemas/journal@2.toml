name = "journal"
version = 2
form = "json"

# journal@1 plus the four caller-identity facts of the deployment record's H-1 (K6, ruled 7bg.10): the row records
# the **version it was written under** (`schema`) and the **credential** that asserted the principal — the SHA-256
# of the client certificate the channel presented, `sha256:<hex>`, which cannot be backfilled after a rotation.
# Both are inside the chained content `c`. `credential` is absent only on a row no channel wrote: the realm's
# binding act, signed by the realm's own key. `trace_id` / `span_id` are the running span's W3C ids, beside `c` where
# `sig` sits and never inside it (C-9: the chain must not depend on whether telemetry was configured); absent when
# no span was running. A chain that began under journal@1 keeps its genesis and continues: the row's own `schema`
# says what each row carries, so the bump is additive and a live journal is never re-genesised.

[[record]]
name = "seq"
type = "int"
required_when = []
range = { min = 1 }

[[record]]
name = "at"
type = "string"
required_when = []
pattern = "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z"

[[record]]
name = "schema"
type = "int"
required_when = []
range = { min = 2, max = 2 }

[[record]]
name = "caller"
type = "string"
required_when = []

[[record]]
name = "credential"
type = "string"
pattern = "sha256:[0-9a-f]{64}"

[[record]]
name = "paths"
type = "array"
required_when = []

[[record]]
name = "repairs"
type = "string"

[[record]]
name = "h"
type = "string"
required_when = []
pattern = "sha256:[0-9a-f]{64}"

[[record]]
name = "sig"
type = "string"

[[record]]
name = "trace_id"
type = "string"
pattern = "[0-9a-f]{32}"

[[record]]
name = "span_id"
type = "string"
pattern = "[0-9a-f]{16}"
