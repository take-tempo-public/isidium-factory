# Root: tooling only. The distributions live under packages/ (isidium-store, isidium-factory).
# Code is LF; the design docs under docs/ are CRLF; .gitattributes keeps bytes as-is either way.

# ---- The lock (K5, ruling 7bg.5: "a deterministic way of tracking all dependencies") ----
#
# The root is a **virtual** workspace root: it ships no distribution of its own, it exists so that one `uv.lock`
# covers both packages and the tools that check them. `uv sync --locked` is what CI runs, and it fails rather than
# resolves when this file and the lock disagree — that is the whole point.
[tool.uv.workspace]
members = ["packages/*"]

# `isidium-factory` depends on `isidium-store` by name; this says the name resolves to the sibling in this tree and
# never to whatever PyPI happens to hold. Declared at the root because a workspace member inherits it.
[tool.uv.sources]
isidium-store = { workspace = true }

# The green bar's own tools, locked with everything else. They are a dependency group and not an extra on purpose:
# nobody installing the store should get pytest, and PEP 735 groups are never part of a published wheel.
[dependency-groups]
dev = [
  # **>= 9.0.3 is a floor, not a preference** [K5, 2026-09-04]: CVE-2025-71176 is pytest's tmpdir handling, fixed in
  # 9.0.3, and it was the first thing tools/osv_scan.py found against this lock's own first resolution (8.4.2). The
  # same shape as `[server]`'s `h11>=0.16` floor, and found by the gate this chunk exists to build rather than by
  # reading an advisory feed.
  "pytest>=9.0.3,<10",
  "pytest-xdist>=3.6,<4",
  "mypy>=2.3,<3",
  "ruff>=0.6,<1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["packages/isidium-store/src", "packages/isidium-factory/src", "tests"]
extend-exclude = ["review-artifacts"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "C4", "PIE", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]  # non-ASCII in comments/docstrings: the design's own characters

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["isidium"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/isidium-store/src:packages/isidium-factory/src"
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true
exclude = ["review-artifacts/"]

[[tool.mypy.overrides]]
module = ["h11.*"]
ignore_missing_imports = true

# The OTLP exporter is the `[telemetry]` extra and is not installed on this workstation — the same reason `h11.*` is
# above. This is NOT a question-hiding ignore (C-7): the two imports it covers are inside `telemetry.configure()`,
# behind the deployment's own `OTEL_*_EXPORTER=otlp`, and every other OpenTelemetry module the package touches
# (`opentelemetry.trace`, `.metrics`, and the SDK the tests drive) is typed and checked.
[[tool.mypy.overrides]]
module = ["opentelemetry.exporter.*"]
ignore_missing_imports = true

[tool.pyright]
extraPaths = ["packages/isidium-store/src", "packages/isidium-factory/src"]
exclude = ["review-artifacts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/isidium-store/src", "packages/isidium-factory/src"]
# No `addopts = "-q"` [K7c, F21]: every recorded command, CI and `tools/mutate.py` pass `-q` themselves, and a second
# one here made each of them `-qq`, which drops the `N passed in ...` summary line. One `-q` is the command line's.
