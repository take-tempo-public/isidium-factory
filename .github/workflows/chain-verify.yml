# The governed-path gate (K8, ruled Q13 2026-09-03). As a REQUIRED status check on every pull request: no governed
# path changed at all — governed paths are written by the store, on `main`, or not at all (7bg.6) — and every
# chained document still recomputes. On every push to `main`: the same verification over what landed, the store's
# own writes included, since the store's deploy key is the one writer the pull-request gate does not see. Same idiom
# as identity-sweep: a property enforced by a check, not a convention remembered.
#
# With `main` requiring a pull request, this check is prevention on a forge that has no path-aware branch rule; on a
# forge that has one (Gitea's protected file patterns) it is the belt under the braces. What it can and cannot see
# is written at the top of tools/verify_chain.py: it does not verify signatures, and it cannot reach the store's
# journal — that reconciliation stays on the factory side.
#
# Kept to checkout → install → one script on purpose, so it runs unchanged on another forge's runner.
name: chain-verify
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # a pull request's diff base is the base branch, which a shallow clone does not hold
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.12" # the floor the package declares and the container ships
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: install the store from the lock, or fail
        # **Locked as of K5.** This step used to `pip install ./packages/isidium-store` and take whatever pydantic
        # PyPI held that morning — for a gate whose whole job is deciding whether a governed document parses.
        # A parser that floats is a verdict that floats. `--locked` refuses a stale lock rather than resolving one.
        run: uv sync --locked --all-packages --all-extras
      - name: verify every governed document
        if: github.event_name == 'push'
        run: uv run --no-sync python tools/verify_chain.py --repo .
      - name: verify, and refuse any governed change off main
        if: github.event_name == 'pull_request'
        run: uv run --no-sync python tools/verify_chain.py --repo . --diff-base "origin/${{ github.base_ref }}"
